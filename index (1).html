<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#1c1c1c;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  font-family:Arial,sans-serif;
}

.calculator{
  width:420px;
  background:#2b2b2b;
  padding:15px;
  border-radius:20px;
  box-shadow:0 0 20px rgba(0,0,0,.4);
}

.screen{
  width:100%;
  height:90px;
  background:#d8e6d3;
  border-radius:10px;
  margin-bottom:15px;
  font-size:28px;
  text-align:right;
  padding:20px;
  overflow:auto;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

button{
  height:55px;
  border:none;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
  background:#4a4a4a;
  color:white;
}

button:hover{
  opacity:.9;
}

.operator{
  background:#ff9800;
}

.equal{
  background:#4caf50;
}
</style>
</head>
<body>

<div class="calculator">

<div class="screen" id="screen">0</div>

<div class="buttons">

<button onclick="clearScreen()">AC</button>
<button onclick="deleteLast()">DEL</button>
<button onclick="append('(')">(</button>
<button onclick="append(')')">)</button>
<button onclick="append('%')">%</button>

<button onclick="append('sin(')">sin</button>
<button onclick="append('cos(')">cos</button>
<button onclick="append('tan(')">tan</button>
<button onclick="append('log(')">log</button>
<button onclick="append('ln(')">ln</button>

<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button class="operator" onclick="append('/')">÷</button>
<button onclick="append('Math.sqrt(')">√</button>

<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button class="operator" onclick="append('*')">×</button>
<button onclick="append('**2')">x²</button>

<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button class="operator" onclick="append('-')">−</button>
<button onclick="append('**')">xʸ</button>

<button onclick="append('0')">0</button>
<button onclick="append('.')">.</button>
<button onclick="append('Math.PI')">π</button>
<button class="operator" onclick="append('+')">+</button>
<button onclick="append('Math.E')">e</button>

<button onclick="append('!')">!</button>
<button onclick="append('asin(')">sin⁻¹</button>
<button onclick="append('acos(')">cos⁻¹</button>
<button onclick="append('atan(')">tan⁻¹</button>
<button class="equal" onclick="calculate()">=</button>

</div>

</div>

<script>

let screen=document.getElementById("screen");
let expression="";

function append(value){
  if(screen.innerHTML==="0") expression="";
  expression+=value;
  screen.innerHTML=expression;
}

function clearScreen(){
  expression="";
  screen.innerHTML="0";
}

function deleteLast(){
  expression=expression.slice(0,-1);
  screen.innerHTML=expression || "0";
}

function factorial(n){
  if(n<0) return NaN;
  let result=1;
  for(let i=2;i<=n;i++) result*=i;
  return result;
}

function calculate(){

  try{

    let exp=expression
      .replace(/sin\(/g,"Math.sin(")
      .replace(/cos\(/g,"Math.cos(")
      .replace(/tan\(/g,"Math.tan(")
      .replace(/asin\(/g,"Math.asin(")
      .replace(/acos\(/g,"Math.acos(")
      .replace(/atan\(/g,"Math.atan(")
      .replace(/log\(/g,"Math.log10(")
      .replace(/ln\(/g,"Math.log(");

    exp=exp.replace(/(\d+)!/g,(match,num)=>{
      return factorial(Number(num));
    });

    let result=eval(exp);

    screen.innerHTML=result;
    expression=result.toString();

  }catch{
    screen.innerHTML="Error";
    expression="";
  }
}

</script>

</body>
</html>
